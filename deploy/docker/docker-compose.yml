name: hani

services:
  postgres:
    image: postgres:16-alpine
    container_name: hani-postgres
    environment:
      POSTGRES_DB: hani
      POSTGRES_USER: hani
      POSTGRES_PASSWORD: hani_dev
    ports:
      - "5433:5432"
    volumes:
      - hani-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hani -d hani"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hani-redis
    ports:
      - "6380:6379"
    volumes:
      - hani-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hani-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hani
      RABBITMQ_DEFAULT_PASS: hani_dev
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - hani-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: hani-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5342:5341"
      - "5381:80"
    volumes:
      - hani-seq-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: hani-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  hani-postgres-data:
  hani-redis-data:
  hani-rabbitmq-data:
  hani-seq-data:
