name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Tool restore
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore Hani.slnx --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build Hani.slnx -warnaserror --no-restore

      - name: Test (unit + architecture)
        run: dotnet test Hani.slnx --no-build --verbosity normal

      - name: Migrations
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Modules/Supply/Hani.Modules.Supply.Infrastructure \
            --startup-project src/Hani.Api \
            --context SupplyDbContext --no-build

          dotnet ef migrations has-pending-model-changes \
            --project src/Modules/Catalog/Hani.Modules.Catalog.Infrastructure \
            --startup-project src/Hani.Api \
            --context CatalogDbContext --no-build

      - name: Format
        run: dotnet format Hani.slnx --verify-no-changes --no-restore

      - name: Vulnerable packages
        run: dotnet list Hani.slnx package --vulnerable --include-transitive
