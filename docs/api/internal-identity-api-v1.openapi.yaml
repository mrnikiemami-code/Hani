openapi: 3.1.0
info:
  title: Hani Internal Identity & Engagement API
  version: 1.0.0
  description: Agency onboarding, review, claim, and media moderation endpoints.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:5099
    description: Local

tags:
  - name: Agency
  - name: Reviews
  - name: Claims
  - name: Media
  - name: Security
  - name: Admin

paths:
  /internal/v1/admin/me:
    get:
      tags: [Admin]
      summary: Get the authenticated admin identity and effective permissions
      responses:
        '200': { description: Admin identity }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /internal/v1/admin/catalog/hotels:
    get:
      tags: [Admin]
      summary: List hotels in the admin catalogue
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: locale, in: query, schema: { type: string, default: fa } }
      responses:
        '200': { description: Paged admin hotel catalogue }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /internal/v1/admin/users:
    get:
      tags: [Admin]
      summary: List users for the admin directory
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [Customer, Author, AgencyStaff, Admin] } }
        - { name: status, in: query, schema: { type: string, enum: [Pending, Active, Blocked, Deleted] } }
      responses:
        '200': { description: Paged admin user directory }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /internal/v1/dashboard/admin:
    get:
      tags: [Admin]
      summary: Get admin order dashboard totals
      responses:
        '200': { description: Admin dashboard summary }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /internal/v1/security/otp:
    get:
      tags: [Security]
      summary: Get the effective OTP security policy
      responses:
        '200': { description: OTP security policy }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
    put:
      tags: [Security]
      summary: Update the OTP security policy
      responses:
        '200': { description: Updated OTP security policy }
        '400': { description: Invalid policy }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /internal/v1/security/otp/unlock:
    post:
      tags: [Security]
      summary: Clear a mobile cooldown or IP block
      responses:
        '204': { description: Security state cleared }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /internal/v1/agencies:
    get:
      tags: [Agency]
      summary: List agencies for the admin panel
      parameters:
        - { name: status, in: query, schema: { type: [string, 'null'], enum: [Active, Suspended, Pending, Rejected, null] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agency' }

  /internal/v1/agencies/{agencyId}/approve:
    post:
      tags: [Agency]
      summary: Approve a pending agency
      parameters:
        - { name: agencyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { type: boolean }

  /internal/v1/agencies/{agencyId}/reject:
    post:
      tags: [Agency]
      summary: Reject a pending agency
      parameters:
        - { name: agencyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { type: boolean }

  /internal/v1/reviews:
    get:
      tags: [Reviews]
      summary: List reviews awaiting moderation
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }

  /internal/v1/reviews/{reviewId}/publish:
    post:
      tags: [Reviews]
      summary: Publish a pending review
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { type: boolean }

  /internal/v1/reviews/{reviewId}/reject:
    post:
      tags: [Reviews]
      summary: Reject a pending review
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { type: boolean }

  /internal/v1/reviews/{reviewId}/reply:
    post:
      tags: [Reviews]
      summary: Add an owner reply to a review
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Reply saved
          content:
            application/json:
              schema: { type: boolean }
        '404': { description: Review not found }
        default: { $ref: '#/components/responses/Problem' }

  /internal/v1/claims:
    get:
      tags: [Claims]
      summary: List ownership/correction claims
      parameters:
        - { name: status, in: query, schema: { type: [string, 'null'], enum: [Pending, Approved, Rejected, null] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimPage' }

  /internal/v1/claims/{claimId}/approve:
    post:
      tags: [Claims]
      summary: Approve a pending claim
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { type: boolean }

  /internal/v1/claims/{claimId}/reject:
    post:
      tags: [Claims]
      summary: Reject a pending claim
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { type: boolean }

  /internal/v1/media:
    get:
      tags: [Media]
      summary: List media assets for moderation
      parameters:
        - { name: status, in: query, schema: { type: [string, 'null'], enum: [Pending, Approved, Rejected, null] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPage' }

  /internal/v1/media/{mediaId}/approve:
    post:
      tags: [Media]
      summary: Approve a pending media asset
      parameters:
        - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { type: boolean }

  /internal/v1/media/{mediaId}/reject:
    post:
      tags: [Media]
      summary: Reject a pending media asset
      parameters:
        - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { type: boolean }

  /internal/v1/agencies/{agencyId}/channel-settings:
    post:
      tags: [Identity]
      summary: Configure channel plan and white-label settings
      parameters:
        - { name: agencyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
        default: { description: Problem }

  /internal/v1/agencies/{agencyId}/channel-webhook:
    post:
      tags: [Identity]
      summary: Configure channel webhook
      parameters:
        - { name: agencyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
        default: { description: Problem }

components:
  schemas:
    ModerationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    Agency:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string }
        city: { type: string }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        rejectionReason: { type: [string, 'null'] }

    Review:
      type: object
      properties:
        reviewId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        authorDisplayName: { type: string }
        targetType: { type: string }
        targetId: { type: string, format: uuid }
        rating: { type: integer }
        status: { type: string }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
        criteria:
          type: object
          additionalProperties: { type: integer }
        proofType: { type: string }
        proofUrl: { type: [string, 'null'] }
        ownerReply: { type: [string, 'null'] }
        ownerRepliedAt: { type: [string, 'null'], format: date-time }

    ReviewPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }

    Claim:
      type: object
      properties:
        claimId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        targetType: { type: string }
        targetId: { type: string, format: uuid }
        claimType: { type: string }
        status: { type: string }
        fullName: { type: string }
        message: { type: string }

    ClaimPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Claim' }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }

    Media:
      type: object
      properties:
        mediaId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        url: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        kind: { type: string }
        status: { type: string }

    MediaPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Media' }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }
