openapi: 3.0.3
info:
  title: Hani Internal Content & Growth API
  version: 1.0.0
  description: Internal editorial, growth, and gamification operations.
servers:
  - url: https://api.hani.ir
paths:
  /internal/v1/content-entries:
    get:
      tags: [Content]
      summary: List admin content entries with search, filters, and pagination
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [Page, Banner, Article, Section] } }
        - { name: status, in: query, schema: { type: string, enum: [Draft, Published, Archived, Scheduled] } }
      responses:
        '200': { description: Paged content entry list }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /internal/v1/content-entries/{id}:
    get:
      tags: [Content]
      summary: Get a content entry for editing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Content entry }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
  /internal/v1/content-media:
    get:
      tags: [Media]
      summary: List media assets with search, folder filter, and pagination
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 12 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: folderId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Paged media list }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /internal/v1/content-media/{id}:
    get:
      tags: [Media]
      summary: Get a media asset for editing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Media asset }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    put:
      tags: [Media]
      summary: Update media metadata, folder, tags, and focal point
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated media asset }
        '400': { description: Invalid metadata }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
  /internal/v1/content/categories:
    post:
      tags: [Content]
      summary: Create a content category
      responses:
        '201': { description: Category id }
  /internal/v1/content/blog:
    post:
      tags: [Content]
      summary: Create a draft blog post
      responses:
        '201': { description: Blog id }
  /internal/v1/content/blog/{slug}/publish:
    post:
      tags: [Content]
      summary: Publish a blog post
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Published }
  /internal/v1/content/travelogues:
    post:
      tags: [Content]
      summary: Create a draft travelogue
      responses:
        '201': { description: Travelogue id }
  /internal/v1/content/travelogues/{slug}/publish:
    post:
      tags: [Content]
      summary: Publish a travelogue
      responses:
        '200': { description: Published }
  /internal/v1/content/videos:
    post:
      tags: [Content]
      summary: Create a draft video
      responses:
        '201': { description: Video id }
  /internal/v1/content/videos/{slug}/publish:
    post:
      tags: [Content]
      summary: Publish a video
      responses:
        '200': { description: Published }
  /internal/v1/content/comments/{commentId}/publish:
    post:
      tags: [Content]
      summary: Publish a pending comment
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Published }
  /internal/v1/content/comments/{commentId}/reject:
    post:
      tags: [Content]
      summary: Reject a pending comment
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Rejected }
  /internal/v1/growth/ads/slots:
    post:
      tags: [Growth]
      summary: Create an ad slot
      responses:
        '201': { description: Slot id }
  /internal/v1/growth/ads/creatives:
    post:
      tags: [Growth]
      summary: Add an ad creative
      responses:
        '201': { description: Creative id }
  /internal/v1/growth/campaigns:
    post:
      tags: [Growth]
      summary: Create a campaign
      responses:
        '201': { description: Campaign id }
  /internal/v1/growth/campaigns/{slug}/activate:
    post:
      tags: [Growth]
      summary: Activate a campaign
      responses:
        '200': { description: Activated }
  /internal/v1/admin/marketing/campaigns:
    get:
      tags: [AdminMarketing]
      summary: List campaigns for the admin panel
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [Draft, Active, Closed] } }
      responses:
        '200': { description: Paged campaign list }
    post:
      tags: [AdminMarketing]
      summary: Create a campaign from the admin panel
      responses:
        '201': { description: Created campaign }
  /internal/v1/admin/marketing/campaigns/{slug}/activate:
    post:
      tags: [AdminMarketing]
      summary: Activate a campaign from the admin panel
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Activated }
  /internal/v1/growth/notifications:
    post:
      tags: [Growth]
      summary: Enqueue a notification
      responses:
        '201': { description: Notification id }
  /internal/v1/growth/analytics:
    post:
      tags: [Growth]
      summary: Record an analytics event
      responses:
        '201': { description: Event id }
  /internal/v1/dashboard/messages:
    post:
      tags: [Dashboard]
      summary: Create a dashboard message
      responses:
        '201': { description: Message id }
  /internal/v1/dashboard/messages/{messageId}/read:
    post:
      tags: [Dashboard]
      summary: Mark a message as read
      responses:
        '200': { description: Read }
  /internal/v1/dashboard/documents:
    post:
      tags: [Dashboard]
      summary: Create a user document
      responses:
        '201': { description: Document id }
  /internal/v1/dashboard/documents/{documentId}/status:
    post:
      tags: [Dashboard]
      summary: Set a document verification status
      responses:
        '200': { description: Updated }
  /internal/v1/gamification/points:
    post:
      tags: [Gamification]
      summary: Award points to a user
      responses:
        '200': { description: Updated profile }
  /internal/v1/gamification/travel-style:
    post:
      tags: [Gamification]
      summary: Set a user's travel style
      responses:
        '200': { description: Updated profile }
  /internal/v1/gamification/badges:
    post:
      tags: [Gamification]
      summary: Create a badge definition
      responses:
        '201': { description: Badge id }
  /internal/v1/gamification/award:
    post:
      tags: [Gamification]
      summary: Award a badge
      responses:
        '201': { description: User badge id }
