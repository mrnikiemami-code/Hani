openapi: 3.1.0
info:
  title: Marketplace API — Draft v1
  version: 1.0.0
  description: |
    Public marketplace reads plus quote/hold flow.
    Booking/contract/payment endpoints are added in Phase 2.
servers:
  - url: https://api.example.com/market/v1
    description: Production
  - url: https://sandbox-api.example.com/market/v1
    description: Sandbox

tags:
  - name: Catalog
  - name: Booking
  - name: Payment

paths:
  /search:
    get:
      tags: [Catalog]
      summary: Search published products with offer price and count
      parameters:
        - name: locale
          in: query
          description: Configured language code (see Localization:SupportedCultures); unknown values fall back to the default language.
          schema: { type: string }
        - { name: destinationSlug, in: query, schema: { type: [string, 'null'] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductSearchItem' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalCount: { type: integer }
                  totalPages: { type: integer }
        default: { $ref: '#/components/responses/Problem' }

  /products/{productId}:
    get:
      tags: [Catalog]
      summary: Read a tour product with localized content and itinerary
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourProduct' }
        default: { $ref: '#/components/responses/Problem' }

  /products/{productId}/compare:
    get:
      tags: [Catalog]
      summary: Compare approved offers for one product
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: locale
          in: query
          description: Configured language code (see Localization:SupportedCultures); unknown values fall back to the default language.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductComparison' }
        '404':
          description: Product not found
        default: { $ref: '#/components/responses/Problem' }

  /quotes:
    post:
      tags: [Booking]
      summary: Create a priced quote (15 minute TTL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuoteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '409':
          description: Not enough seats
        default: { $ref: '#/components/responses/Problem' }

  /quotes/{quoteId}:
    get:
      tags: [Booking]
      summary: Read a quote
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '404':
          description: Not found
        default: { $ref: '#/components/responses/Problem' }

  /holds:
    post:
      tags: [Booking]
      summary: Reserve seats for a quote (idempotent)
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '409':
          description: Quote expired or not enough seats
        default: { $ref: '#/components/responses/Problem' }

  /holds/{holdId}:
    delete:
      tags: [Booking]
      summary: Release a hold and return its seats
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Released
        '404':
          description: Not found
        default: { $ref: '#/components/responses/Problem' }

  /orders:
    post:
      tags: [Booking]
      summary: Create an order and immutable contract from an active hold
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{orderId}:
    get:
      tags: [Booking]
      summary: Read an order
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{orderId}/contract:
    get:
      tags: [Booking]
      summary: Read the immutable contract issued for an order
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        default: { $ref: '#/components/responses/Problem' }

  /payments/intents:
    post:
      tags: [Payment]
      summary: Create a payment intent for a pending order
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        default: { $ref: '#/components/responses/Problem' }

  /payments/intents/{paymentIntentId}:
    get:
      tags: [Payment]
      summary: Read a payment intent
      parameters:
        - { name: paymentIntentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        default: { $ref: '#/components/responses/Problem' }

  /payments/webhook/{provider}:
    post:
      tags: [Payment]
      summary: Verify and process a provider webhook
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: X-Payment-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Payment-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhookRequest' }
      responses:
        '200':
          description: Processed, duplicate, ignored, or failed event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentWebhookResult' }
        default: { $ref: '#/components/responses/Problem' }

components:
  responses:
    Problem:
      description: RFC 7807 problem details with code, correlationId, traceId, locale, and optional field errors
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, correlationId, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        traceId: { type: string }
        locale: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    ProductSearchItem:
      type: object
      properties:
        productId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        durationDays: { type: integer }
        tourType: { type: string }
        minPrice: { type: [number, 'null'] }
        currency: { type: [string, 'null'] }
        offerCount: { type: integer }
        destinationIds:
          type: array
          items: { type: string, format: uuid }

    ProductComparison:
      type: object
      properties:
        productId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        description: { type: string }
        durationDays: { type: integer }
        offers:
          type: array
          items: { $ref: '#/components/schemas/OfferComparison' }

    OfferComparison:
      type: object
      properties:
        offerId: { type: string, format: uuid }
        agencyId: { type: string, format: uuid }
        agencyName: { type: string }
        title: { type: string }
        minPrice: { type: number }
        currency: { type: string }
        departures:
          type: array
          items: { $ref: '#/components/schemas/DepartureComparison' }

    DepartureComparison:
      type: object
      properties:
        id: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        seatsLeft: { type: integer }
        status: { type: string }
        prices:
          type: array
          items:
            type: object
            properties:
              roomType: { type: string }
              amount: { type: number }
              currency: { type: string }

    CreateQuoteRequest:
      type: object
      required: [departureId, roomType, adults]
      properties:
        departureId: { type: string, format: uuid }
        roomType: { type: string, enum: [Double, Single, Triple, ChildWithBed, ChildWithoutBed, Infant] }
        adults: { type: integer, minimum: 1, maximum: 10 }
        children: { type: integer, minimum: 0, maximum: 10, default: 0 }
        infants: { type: integer, minimum: 0, maximum: 10, default: 0 }

    PriceComponent:
      type: object
      properties:
        kind: { type: string, enum: [Base, Fee, Discount] }
        baseAmount: { type: number }
        currency: { type: string }
        dutyStatus: { type: string, enum: [Applicable, ZeroRated, NotApplicable, Exempt] }
        dutyRate: { type: number }
        dutyAmount: { type: number }
        vatStatus: { type: string, enum: [Applicable, ZeroRated, NotApplicable, Exempt] }
        vatRate: { type: number }
        vatAmount: { type: number }
        totalAmount: { type: number }

    Quote:
      type: object
      properties:
        quoteId: { type: string, format: uuid }
        departureId: { type: string, format: uuid }
        agencyOfferId: { type: string, format: uuid }
        agencyId: { type: string, format: uuid }
        roomType: { type: string }
        adults: { type: integer }
        children: { type: integer }
        infants: { type: integer }
        seats: { type: integer }
        unitPrice: { type: number }
        total: { type: number }
        currency: { type: string }
        status: { type: string, enum: [Active, Held, Expired, Converted, Cancelled] }
        expiresAt: { type: string, format: date-time }
        components:
          type: array
          items: { $ref: '#/components/schemas/PriceComponent' }

    Hold:
      type: object
      properties:
        holdId: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        departureId: { type: string, format: uuid }
        seats: { type: integer }
        status: { type: string, enum: [Active, Released, Consumed, Expired] }
        expiresAt: { type: string, format: date-time }

    OrderTravelerInput:
      type: object
      required: [fullName, type]
      properties:
        fullName: { type: string, maxLength: 200 }
        type: { type: string, enum: [Adult, Child, Infant] }
        dateOfBirth: { type: [string, 'null'], format: date }

    CreateOrderRequest:
      type: object
      required: [holdId, contactEmail, travelers]
      properties:
        holdId: { type: string, format: uuid }
        contactEmail: { type: string, format: email, maxLength: 320 }
        contactPhone: { type: [string, 'null'], maxLength: 32 }
        travelers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderTravelerInput' }

    OrderTraveler:
      type: object
      properties:
        travelerId: { type: string, format: uuid }
        fullName: { type: string }
        type: { type: string, enum: [Adult, Child, Infant] }
        dateOfBirth: { type: [string, 'null'], format: date }

    OrderLine:
      type: object
      properties:
        lineId: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        total: { type: number }
        currency: { type: string }

    Order:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        quoteId: { type: string, format: uuid }
        holdId: { type: string, format: uuid }
        agencyId: { type: string, format: uuid }
        agencyOfferId: { type: string, format: uuid }
        departureId: { type: string, format: uuid }
        roomType: { type: string }
        adults: { type: integer }
        children: { type: integer }
        infants: { type: integer }
        seats: { type: integer }
        unitPrice: { type: number }
        total: { type: number }
        currency: { type: string }
        status: { type: string, enum: [PendingPayment, PartiallyPaid, Paid, Cancelled, Expired] }
        paymentStatus: { type: string, enum: [Unpaid, PartiallyPaid, Paid] }
        createdAt: { type: string, format: date-time }
        paymentDueAt: { type: string, format: date-time }
        contractId: { type: string, format: uuid }
        contractNumber: { type: string }
        travelers:
          type: array
          items: { $ref: '#/components/schemas/OrderTraveler' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        components:
          type: array
          items: { $ref: '#/components/schemas/PriceComponent' }

    Contract:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        contractNumber: { type: string }
        orderId: { type: string, format: uuid }
        issuedAt: { type: string, format: date-time }
        quoteId: { type: string, format: uuid }
        holdId: { type: string, format: uuid }
        agencyId: { type: string, format: uuid }
        agencyOfferId: { type: string, format: uuid }
        departureId: { type: string, format: uuid }
        roomType: { type: string }
        adults: { type: integer }
        children: { type: integer }
        infants: { type: integer }
        seats: { type: integer }
        unitPrice: { type: number }
        total: { type: number }
        currency: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: [string, 'null'] }
        travelers:
          type: array
          items: { $ref: '#/components/schemas/OrderTraveler' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        components:
          type: array
          items: { $ref: '#/components/schemas/PriceComponent' }

    CreatePaymentIntentRequest:
      type: object
      required: [orderId]
      properties:
        orderId: { type: string, format: uuid }
        currency: { type: [string, 'null'], minLength: 3, maxLength: 3 }
        paymentObligationId: { type: [string, 'null'], format: uuid }

    PaymentIntent:
      type: object
      properties:
        paymentIntentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        agencyId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        paymentObligationId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [Created, Pending, Succeeded, Failed, Expired] }
        provider: { type: string }
        providerRef: { type: [string, 'null'] }
        redirectUrl: { type: [string, 'null'], format: uri }
        pspAccountRef: { type: string }
        merchantScope: { type: string, enum: [Hani, Agency] }
        fundsHeldBy: { type: string }
        failureReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    PaymentWebhookRequest:
      type: object
      required: [eventId, paymentIntentId, type]
      properties:
        eventId: { type: string }
        paymentIntentId: { type: string, format: uuid }
        providerRef: { type: string }
        type: { type: string, enum: [payment.succeeded, payment.failed] }
        occurredAt: { type: string, format: date-time }

    PaymentWebhookResult:
      type: object
      properties:
        provider: { type: string }
        providerEventId: { type: string }
        status: { type: string, enum: [Processed, Duplicate, Ignored, Failed] }
        processedAt: { type: [string, 'null'], format: date-time }

    TourProductTranslation:
      type: object
      properties:
        locale: { type: string }
        title: { type: string }
        summary: { type: string }
        description: { type: string }
        seoTitle: { type: [string, 'null'] }
        seoDescription: { type: [string, 'null'] }
        mealsSummary: { type: [string, 'null'] }
        includedServices: { type: [string, 'null'] }
        excludedServices: { type: [string, 'null'] }
        cancellationPolicy: { type: [string, 'null'] }
        additionalInfo: { type: [string, 'null'] }
        requiredItems: { type: [string, 'null'] }

    TourItineraryDayTranslation:
      type: object
      properties:
        locale: { type: string }
        title: { type: string }
        description: { type: string }
        accommodation: { type: [string, 'null'] }

    TourItineraryDay:
      type: object
      properties:
        dayNumber: { type: integer }
        breakfast: { type: boolean }
        lunch: { type: boolean }
        dinner: { type: boolean }
        translations:
          type: array
          items: { $ref: '#/components/schemas/TourItineraryDayTranslation' }

    TourProduct:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        durationDays: { type: integer }
        tourType: { type: string }
        status: { type: string, enum: [Draft, Published, Archived] }
        originDestinationId: { type: [string, 'null'], format: uuid }
        difficulty: { type: string, enum: [Easy, Normal, Hard] }
        vehicleType: { type: string, enum: [None, Bus, VipBus, Minibus, Van, Train, Plane, Car, Other] }
        localVehicleType: { type: string, enum: [None, Bus, VipBus, Minibus, Van, Train, Plane, Car, Other] }
        accommodationType: { type: string, enum: [Hotel, Camp, GuestHouse, EcoLodge, Apartment, Other] }
        createdAt: { type: string, format: date-time }
        translations:
          type: array
          items: { $ref: '#/components/schemas/TourProductTranslation' }
        destinationIds:
          type: array
          items: { type: string, format: uuid }
        itineraryDays:
          type: array
          items: { $ref: '#/components/schemas/TourItineraryDay' }
