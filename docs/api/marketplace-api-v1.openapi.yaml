openapi: 3.1.0
info:
  title: Marketplace API — Draft v1
  version: 1.0.0
  description: |
    Public marketplace reads plus quote/hold flow.
    Booking/contract/payment endpoints are added in Phase 2.
servers:
  - url: https://api.example.com/market/v1
    description: Production
  - url: https://sandbox-api.example.com/market/v1
    description: Sandbox

tags:
  - name: Catalog
  - name: Identity
  - name: Booking
  - name: Payment

paths:
  /search:
    get:
      tags: [Catalog]
      summary: Search published products with offer price and count
      parameters:
        - name: locale
          in: query
          description: Configured language code (see Localization:SupportedCultures); unknown values fall back to the default language.
          schema: { type: string }
        - { name: destinationSlug, in: query, schema: { type: [string, 'null'] } }
        - { name: originSlug, in: query, schema: { type: [string, 'null'] } }
        - { name: startDate, in: query, schema: { type: [string, 'null'], format: date } }
        - { name: endDate, in: query, schema: { type: [string, 'null'], format: date } }
        - { name: minDuration, in: query, schema: { type: [integer, 'null'], minimum: 0 } }
        - { name: maxDuration, in: query, schema: { type: [integer, 'null'], minimum: 0 } }
        - { name: tourType, in: query, schema: { type: [string, 'null'] } }
        - { name: difficulty, in: query, schema: { type: [string, 'null'] } }
        - { name: vehicleType, in: query, schema: { type: [string, 'null'] } }
        - { name: accommodationType, in: query, schema: { type: [string, 'null'] } }
        - { name: minPrice, in: query, schema: { type: [number, 'null'], minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: [number, 'null'], minimum: 0 } }
        - { name: currency, in: query, schema: { type: [string, 'null'], minLength: 3, maxLength: 3 } }
        - { name: hotelStars, in: query, schema: { type: [integer, 'null'], minimum: 1, maximum: 5 } }
        - { name: mealPlan, in: query, schema: { type: [string, 'null'] } }
        - { name: airline, in: query, schema: { type: [string, 'null'] } }
        - { name: agencyId, in: query, schema: { type: [string, 'null'], format: uuid } }
        - { name: adults, in: query, schema: { type: [integer, 'null'], minimum: 1 } }
        - { name: children, in: query, schema: { type: [integer, 'null'], minimum: 0 } }
        - { name: infants, in: query, schema: { type: [integer, 'null'], minimum: 0 } }
        - { name: hotel, in: query, schema: { type: [string, 'null'] } }
        - { name: roomType, in: query, schema: { type: [string, 'null'] } }
        - { name: cabin, in: query, schema: { type: [string, 'null'] } }
        - { name: q, in: query, schema: { type: [string, 'null'] } }
        - { name: onlineOnly, in: query, schema: { type: boolean, default: false } }
        - name: sort
          in: query
          schema: { type: [string, 'null'], enum: [price_asc, price_desc, duration_asc, duration_desc, newest, title, null] }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductSearchItem' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalCount: { type: integer }
                  totalPages: { type: integer }
        default: { $ref: '#/components/responses/Problem' }

  /products/{productId}:
    get:
      tags: [Catalog]
      summary: Read a tour product with localized content and itinerary
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourProduct' }
        default: { $ref: '#/components/responses/Problem' }

  /products/{productId}/compare:
    get:
      tags: [Catalog]
      summary: Compare approved offers for one product
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: locale
          in: query
          description: Configured language code (see Localization:SupportedCultures); unknown values fall back to the default language.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductComparison' }
        '404':
          description: Product not found
        default: { $ref: '#/components/responses/Problem' }

  /products/{productId}/seo:
    get:
      tags: [Catalog]
      summary: Read canonical, alternate and JSON-LD SEO metadata for a product
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: locale, in: query, schema: { type: [string, 'null'] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSeo' }
        '404':
          description: Product not found
        default: { $ref: '#/components/responses/Problem' }

  /destinations/{slug}/landing:
    get:
      tags: [Catalog]
      summary: Read landing-page SEO metadata for a destination
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: locale, in: query, schema: { type: [string, 'null'] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingSeo' }
        '404':
          description: Destination not found
        default: { $ref: '#/components/responses/Problem' }

  /seo/sitemap.xml:
    get:
      tags: [Catalog]
      summary: Read the localized XML sitemap
      responses:
        '200':
          description: XML sitemap
          content:
            application/xml:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /seo/robots.txt:
    get:
      tags: [Catalog]
      summary: Read crawler policy
      responses:
        '200':
          description: robots.txt
          content:
            text/plain:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /auth/otp/request:
    post:
      tags: [Identity]
      summary: Request a login OTP for a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOtpRequest' }
      responses:
        '200':
          description: OTP requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestOtpResult' }
        '409':
          description: Cooldown or rate limit
        default: { $ref: '#/components/responses/Problem' }

  /auth/otp/verify:
    post:
      tags: [Identity]
      summary: Verify an OTP and issue JWT/refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      tags: [Identity]
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401':
          description: Invalid or expired refresh token
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Identity]
      summary: Revoke a refresh token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { type: boolean }
        '401':
          description: Unauthorized
        default: { $ref: '#/components/responses/Problem' }

  /auth/me:
    get:
      tags: [Identity]
      summary: Read the authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Unauthorized
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Identity]
      summary: Update the authenticated user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/me/username:
    put:
      tags: [Identity]
      summary: Change the public username
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeUsernameRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409':
          description: Username already used
        default: { $ref: '#/components/responses/Problem' }

  /authors/{username}:
    get:
      tags: [Identity]
      summary: Read a public author profile
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Author' }
        '404':
          description: Author not found
        default: { $ref: '#/components/responses/Problem' }

  /agencies/onboarding:
    post:
      tags: [Identity]
      summary: Submit an agency onboarding request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgencyOnboardingRequest' }
      responses:
        '200':
          description: Created pending agency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '400':
          description: Invalid onboarding
        '409':
          description: Slug already used
        default: { $ref: '#/components/responses/Problem' }

  /agencies/me:
    get:
      tags: [Identity]
      summary: Read the current user's agency onboarding state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '404':
          description: No onboarding found
        default: { $ref: '#/components/responses/Problem' }

  /agencies/{slug}:
    get:
      tags: [Identity]
      summary: Read a public approved agency profile
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicAgency' }
        '404':
          description: Agency not found
        default: { $ref: '#/components/responses/Problem' }

  /trust:
    get:
      tags: [Identity]
      summary: Read public trust and support information
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trust' }
        default: { $ref: '#/components/responses/Problem' }

  /reviews:
    get:
      tags: [Identity]
      summary: Read published reviews for a target
      parameters:
        - { name: targetType, in: query, required: true, schema: { type: string, enum: [Tour, Hotel, Agency, Attraction, Restaurant] } }
        - { name: targetId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: minRating, in: query, schema: { type: [integer, 'null'], minimum: 1, maximum: 5 } }
        - { name: sort, in: query, schema: { type: [string, 'null'], enum: [newest, helpful, rating, null] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Identity]
      summary: Create a pending review for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
        '200':
          description: Pending review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        default: { $ref: '#/components/responses/Problem' }

  /reviews/{reviewId}/helpful:
    post:
      tags: [Identity]
      summary: Mark a review helpful
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Vote result
          content:
            application/json:
              schema: { type: boolean }
        default: { $ref: '#/components/responses/Problem' }

  /reviews/{reviewId}/report:
    post:
      tags: [Identity]
      summary: Report a published review
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationRequest' }
      responses:
        '200':
          description: Report result
          content:
            application/json:
              schema: { type: boolean }
        default: { $ref: '#/components/responses/Problem' }

  /claims:
    post:
      tags: [Identity]
      summary: Create an ownership or correction claim
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClaimRequest' }
      responses:
        '200':
          description: Pending claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        default: { $ref: '#/components/responses/Problem' }

  /media:
    post:
      tags: [Identity]
      summary: Register a media asset for moderation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterMediaRequest' }
      responses:
        '200':
          description: Pending media
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        default: { $ref: '#/components/responses/Problem' }

  /quotes:
    post:
      tags: [Booking]
      summary: Create a priced quote (15 minute TTL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuoteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '409':
          description: Not enough seats
        default: { $ref: '#/components/responses/Problem' }

  /quotes/{quoteId}:
    get:
      tags: [Booking]
      summary: Read a quote
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '404':
          description: Not found
        default: { $ref: '#/components/responses/Problem' }

  /holds:
    post:
      tags: [Booking]
      summary: Reserve seats for a quote (idempotent)
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '409':
          description: Quote expired or not enough seats
        default: { $ref: '#/components/responses/Problem' }

  /holds/{holdId}:
    delete:
      tags: [Booking]
      summary: Release a hold and return its seats
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Released
        '404':
          description: Not found
        default: { $ref: '#/components/responses/Problem' }

  /orders:
    post:
      tags: [Booking]
      summary: Create an order and immutable contract from an active hold
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{orderId}:
    get:
      tags: [Booking]
      summary: Read an order
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{orderId}/contract:
    get:
      tags: [Booking]
      summary: Read the immutable contract issued for an order
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        default: { $ref: '#/components/responses/Problem' }

  /payments/intents:
    post:
      tags: [Payment]
      summary: Create a payment intent for a pending order
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        default: { $ref: '#/components/responses/Problem' }

  /payments/intents/{paymentIntentId}:
    get:
      tags: [Payment]
      summary: Read a payment intent
      parameters:
        - { name: paymentIntentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        default: { $ref: '#/components/responses/Problem' }

  /payments/webhook/{provider}:
    post:
      tags: [Payment]
      summary: Verify and process a provider webhook
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: X-Payment-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Payment-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhookRequest' }
      responses:
        '200':
          description: Processed, duplicate, ignored, or failed event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentWebhookResult' }
        default: { $ref: '#/components/responses/Problem' }

components:
  responses:
    Problem:
      description: RFC 7807 problem details with code, correlationId, traceId, locale, and optional field errors
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, correlationId, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        traceId: { type: string }
        locale: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    ProductSearchItem:
      type: object
      properties:
        productId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        durationDays: { type: integer }
        tourType: { type: string }
        minPrice: { type: [number, 'null'] }
        currency: { type: [string, 'null'] }
        offerCount: { type: integer }
        destinationIds:
          type: array
          items: { type: string, format: uuid }
        minPrices:
          type: array
          items: { $ref: '#/components/schemas/CurrencyPrice' }
        originDestinationId: { type: [string, 'null'], format: uuid }
        difficulty: { type: string }
        vehicleType: { type: string }
        localVehicleType: { type: string }
        accommodationType: { type: string }

    CurrencyPrice:
      type: object
      properties:
        currency: { type: string }
        amount: { type: number }

    ProductComparison:
      type: object
      properties:
        productId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        description: { type: string }
        durationDays: { type: integer }
        offers:
          type: array
          items: { $ref: '#/components/schemas/OfferComparison' }

    OfferComparison:
      type: object
      properties:
        offerId: { type: string, format: uuid }
        agencyId: { type: string, format: uuid }
        agencyName: { type: string }
        title: { type: string }
        minPrice: { type: number }
        currency: { type: string }
        minPrices:
          type: array
          items: { $ref: '#/components/schemas/CurrencyPrice' }
        accommodationOptions:
          type: array
          items: { $ref: '#/components/schemas/AccommodationOption' }
        flightOptions:
          type: array
          items: { $ref: '#/components/schemas/FlightOption' }
        taxRules:
          type: array
          items: { $ref: '#/components/schemas/TaxRule' }
        departures:
          type: array
          items: { $ref: '#/components/schemas/DepartureComparison' }

    AccommodationOption:
      type: object
      properties:
        optionId: { type: string, format: uuid }
        hotelName: { type: string }
        hotelStars: { type: integer }
        roomType: { type: string }
        mealPlan: { type: string }
        amount: { type: number }
        currency: { type: string }
        description: { type: [string, 'null'] }

    FlightOption:
      type: object
      properties:
        optionId: { type: string, format: uuid }
        direction: { type: string, enum: [Outbound, Inbound] }
        airline: { type: string }
        flightNumber: { type: string }
        departureAirport: { type: string }
        arrivalAirport: { type: string }
        departureTime: { type: string, format: time }
        arrivalTime: { type: string, format: time }
        durationMinutes: { type: integer }
        cabin: { type: string }
        baggageAllowance: { type: string }

    TaxRule:
      type: object
      properties:
        currency: { type: string }
        vatStatus: { type: string, enum: [Applicable, ZeroRated, NotApplicable, Exempt] }
        vatRate: { type: number }
        dutyStatus: { type: string, enum: [Applicable, ZeroRated, NotApplicable, Exempt] }
        dutyRate: { type: number }
        exemptionReason: { type: [string, 'null'] }

    DepartureComparison:
      type: object
      properties:
        id: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        seatsLeft: { type: integer }
        status: { type: string }
        prices:
          type: array
          items:
            type: object
            properties:
              roomType: { type: string }
