components:
  responses:
    Problem:
      description: RFC 7807 problem details with code, correlationId, traceId, locale, and optional field errors
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, correlationId, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        traceId: { type: string }
        locale: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    ProductSearchItem:
      type: object
      properties:
        productId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        durationDays: { type: integer }
        tourType: { type: string }
        minPrice: { type: [number, 'null'] }
        currency: { type: [string, 'null'] }
        offerCount: { type: integer }
        destinationIds:
          type: array
          items: { type: string, format: uuid }
        minPrices:
          type: array
          items: { $ref: '#/components/schemas/CurrencyPrice' }
        bookingModes:
          type: array
          items: { type: string, enum: [Online, ReservationRequest] }
        installmentAvailable: { type: boolean }
        category: { type: string, enum: [Normal, Installment, Luxury] }
        travelType: { type: string, enum: [Other, Air, Bus, Rail] }
        originDestinationId: { type: [string, 'null'], format: uuid }
        difficulty: { type: string }
        vehicleType: { type: string }
        localVehicleType: { type: string }
        accommodationType: { type: string }

    CurrencyPrice:
      type: object
      properties:
        currency: { type: string }
        amount: { type: number }

    ProductComparison:
      type: object
      properties:
        productId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        description: { type: string }
        durationDays: { type: integer }
        offers:
          type: array
          items: { $ref: '#/components/schemas/OfferComparison' }

    OfferComparison:
      type: object
      properties:
        offerId: { type: string, format: uuid }
        agencyId: { type: string, format: uuid }
        agencyName: { type: string }
        title: { type: string }
        minPrice: { type: number }
        currency: { type: string }
        minPrices:
          type: array
          items: { $ref: '#/components/schemas/CurrencyPrice' }
        accommodationOptions:
          type: array
          items: { $ref: '#/components/schemas/AccommodationOption' }
        flightOptions:
          type: array
          items: { $ref: '#/components/schemas/FlightOption' }
        taxRules:
          type: array
          items: { $ref: '#/components/schemas/TaxRule' }
        departures:
          type: array
          items: { $ref: '#/components/schemas/DepartureComparison' }
        bookingMode: { type: string, enum: [Online, ReservationRequest] }
        collectionMode: { type: string, enum: [HaniOnline, AgencyOnline, AgencyOffline] }
        installmentTerms:
          oneOf:
            - $ref: '#/components/schemas/InstallmentTerms'
            - type: 'null'

    AccommodationOption:
      type: object
      properties:
        optionId: { type: string, format: uuid }
        hotelId: { type: [string, 'null'], format: uuid }
        hotelName: { type: string }
        hotelStars: { type: integer }
        roomType: { type: string }
        mealPlan: { type: string }
        amount: { type: number }
        currency: { type: string }
        description: { type: [string, 'null'] }

    FlightOption:
      type: object
      properties:
        optionId: { type: string, format: uuid }
        direction: { type: string, enum: [Outbound, Inbound] }
        airline: { type: string }
        flightNumber: { type: string }
        departureAirport: { type: string }
        arrivalAirport: { type: string }
        departureTime: { type: string, format: time }
        arrivalTime: { type: string, format: time }
        durationMinutes: { type: integer }
        cabin: { type: string }
        baggageAllowance: { type: string }

    TaxRule:
      type: object
      properties:
        currency: { type: string }
        vatStatus: { type: string, enum: [Applicable, ZeroRated, NotApplicable, Exempt] }
        vatRate: { type: number }
        dutyStatus: { type: string, enum: [Applicable, ZeroRated, NotApplicable, Exempt] }
        dutyRate: { type: number }
        exemptionReason: { type: [string, 'null'] }

    DepartureComparison:
      type: object
      properties:
        id: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        seatsLeft: { type: integer }
        status: { type: string }
        prices:
          type: array
          items:
            type: object
            properties:
              roomType: { type: string }
              amount: { type: number }
              currency: { type: string }

    CreateQuoteRequest:
      type: object
      required: [departureId, roomType, adults]
      properties:
        departureId: { type: string, format: uuid }
        roomType: { type: string, enum: [Double, Single, Triple, ChildWithBed, ChildWithoutBed, Infant] }
        adults: { type: integer, minimum: 1, maximum: 10 }
        children: { type: integer, minimum: 0, maximum: 10, default: 0 }
        infants: { type: integer, minimum: 0, maximum: 10, default: 0 }
        accommodationOptionId: { type: [string, 'null'], format: uuid }

    InstallmentTerms:
      type: object
      properties:
        isEnabled: { type: boolean }
        minDownPaymentRate: { type: number, minimum: 0, maximum: 1 }
        maxMonths: { type: integer, minimum: 1, maximum: 36 }
        monthlyFeeRate: { type: number, minimum: 0, maximum: 1 }
        requiresCheque: { type: boolean }

    PriceComponent:
      type: object
      properties:
        kind: { type: string, enum: [Base, Fee, Discount] }
        baseAmount: { type: number }
        currency: { type: string }
        dutyStatus: { type: string, enum: [Applicable, ZeroRated, NotApplicable, Exempt] }
        dutyRate: { type: number }
        dutyAmount: { type: number }
        vatStatus: { type: string, enum: [Applicable, ZeroRated, NotApplicable, Exempt] }
        vatRate: { type: number }
        vatAmount: { type: number }
        totalAmount: { type: number }

    AccommodationSelection:
      type: object
      properties:
        optionId: { type: string, format: uuid }
        hotelId: { type: [string, 'null'], format: uuid }
        hotelName: { type: string }
        hotelStars: { type: integer }
        roomType: { type: string }
        mealPlan: { type: string }
        currency: { type: string }

    AlternateUrl:
      type: object
      properties:
        locale: { type: string }
        url: { type: string, format: uri }

    BreadcrumbItem:
      type: object
      properties:
        name: { type: string }
        url: { type: string, format: uri }

    ProductSeo:
      type: object
      properties:
        productId: { type: string, format: uuid }
        slug: { type: string }
        locale: { type: string }
        canonicalUrl: { type: string, format: uri }
        title: { type: string }
        description: { type: string }
        robots: { type: string }
        alternates:
          type: array
          items: { $ref: '#/components/schemas/AlternateUrl' }
        breadcrumbs:
          type: array
          items: { $ref: '#/components/schemas/BreadcrumbItem' }
        breadcrumbJsonLd: { type: string }
        productJsonLd: { type: string }

    LandingSeo:
      type: object
      properties:
        slug: { type: string }
        locale: { type: string }
        canonicalUrl: { type: string, format: uri }
        title: { type: string }
        description: { type: string }
        productCount: { type: integer }
        robots: { type: string }
        alternates:
          type: array
          items: { $ref: '#/components/schemas/AlternateUrl' }
        breadcrumbs:
          type: array
          items: { $ref: '#/components/schemas/BreadcrumbItem' }
        breadcrumbJsonLd: { type: string }
        collectionJsonLd: { type: string }

    Quote:
      type: object
      properties:
        quoteId: { type: string, format: uuid }
        departureId: { type: string, format: uuid }
        agencyOfferId: { type: string, format: uuid }
        agencyId: { type: string, format: uuid }
        roomType: { type: string }
        adults: { type: integer }
        children: { type: integer }
        infants: { type: integer }
        seats: { type: integer }
        unitPrice: { type: number }
