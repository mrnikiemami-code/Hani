openapi: 3.1.0
info:
  title: Hani Internal Payments API — Draft v1
  version: 1.0.0
  description: Internal refund and invoice operations for Hani MoR.
servers:
  - url: https://api.hani.ir/internal/v1
paths:
  /payments/refunds:
    post:
      tags: [Payments]
      summary: Request a refund
      responses:
        '200': { description: Refund requested }
        default: { description: Problem }
  /payments/refunds/{refundId}/process:
    post:
      tags: [Payments]
      summary: Process a refund
      parameters:
        - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Refund processed }
        default: { description: Problem }
  /payments/refunds/{refundId}:
    get:
      tags: [Payments]
      summary: Read a refund
      parameters:
        - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Refund }
        default: { description: Problem }
  /payments/orders/{orderId}/refunds:
    get:
      tags: [Payments]
      summary: List refunds for an order
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Refunds }
        default: { description: Problem }
  /payments/invoices:
    post:
      tags: [Payments]
      summary: Create an invoice
      responses:
        '200': { description: Invoice created }
        default: { description: Problem }
  /payments/invoices/{invoiceId}:
    get:
      tags: [Payments]
      summary: Read an invoice
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Invoice }
        default: { description: Problem }
  /payments/invoices/{invoiceId}/remind:
    post:
      tags: [Payments]
      summary: Send the next invoice reminder
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Reminder scheduled }
        default: { description: Problem }
  /payments/chargebacks:
    post:
      tags: [Payments]
      summary: Open a chargeback
      responses:
        '200': { description: Chargeback opened }
        default: { description: Problem }
  /payments/chargebacks/{chargebackId}/resolve:
    post:
      tags: [Payments]
      summary: Resolve a chargeback
      parameters:
        - { name: chargebackId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Resolved }
        default: { description: Problem }
  /payments/reconciliations:
    post:
      tags: [Payments]
      summary: Create a reconciliation record
      responses:
        '200': { description: Reconciliation created }
        default: { description: Problem }
