openapi: 3.1.0
info:
  title: Hani Internal Catalog API
  version: 1.0.0
  description: Admin catalogue read and hotel content operations.
servers:
  - url: https://api.hani.ir
paths:
  /internal/v1/admin/catalog/hotels:
    get:
      tags: [Catalog]
      summary: List hotels in the admin catalogue
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: locale, in: query, schema: { type: string } }
      responses:
        '200': { description: Paged hotel catalogue }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /internal/v1/admin/catalog/hotels/{id}:
    get:
      tags: [Catalog]
      summary: Get a hotel with translations, gallery, amenities, and rooms
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Hotel detail }
        '404': { description: Not found }
    put:
      tags: [Catalog]
      summary: Update hotel content, contact, publication, SEO, gallery, amenities, and rooms
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated hotel detail }
        '400': { description: Invalid hotel content }
        '404': { description: Not found }
  /internal/v1/admin/catalog/hotels/{id}/publish:
    post:
      tags: [Catalog]
      summary: Publish a hotel
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Published hotel }
        '404': { description: Not found }

  /internal/v1/admin/catalog/tours/{id}:
    get:
      tags: [Catalog]
      summary: Get a tour product for editing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Tour product detail }
        '404': { description: Not found }
    put:
      tags: [Catalog]
      summary: Update tour overview, content, scope, category, and cover
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid tour content }
        '404': { description: Not found }

  /internal/v1/admin/catalog/visas/{id}:
    get:
      tags: [Catalog]
      summary: Get a visa country with translations and types
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Visa country detail }
        '404': { description: Not found }
    put:
      tags: [Catalog]
      summary: Update visa country content, types, pricing, and processing time
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid visa content }
        '404': { description: Not found }

  /internal/v1/admin/catalog/flights/routes/{id}:
    get:
      tags: [Catalog]
      summary: Get a flight route and its provider offers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Flight route detail }
        '404': { description: Not found }
    put:
      tags: [Catalog]
      summary: Update flight route metadata and replace provider offers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid flight route }
        '404': { description: Not found }
